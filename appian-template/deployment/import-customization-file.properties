# Import Customization File
# This file contains environment-specific configurations for importing the Appian application template
# Update these values according to your target environment before importing

# Environment Configuration
environment.name=PRODUCTION
environment.type=CLOUD

# Database Configuration
# Update these if you're using external database connections
database.host=your-database-host.com
database.port=5432
database.name=appian_app
database.username=appian_user
database.password=your-database-password

# Email Configuration
smtp.host=smtp.yourcompany.com
smtp.port=587
smtp.username=noreply@yourcompany.com
smtp.password=your-smtp-password
smtp.from.address=noreply@yourcompany.com
smtp.from.name=Appian Application

# Application URLs
app.base.url=https://your-site.appiancloud.com
app.support.email=support@yourcompany.com
app.admin.email=admin@yourcompany.com

# Security Groups Mapping
# Map template groups to your environment groups
group.administrators=APP_Administrators
group.managers=APP_Managers
group.users=APP_Users
group.viewers=APP_Viewers

# User Mapping (for process model assignees)
# Replace template users with actual users in your environment
user.system.admin=john.doe
user.hr.manager=jane.smith
user.it.admin=mike.johnson

# File Storage Configuration
file.storage.path=/opt/appian/files/
file.temp.path=/opt/appian/temp/
file.max.size.mb=10

# Integration Endpoints
# Update these with your actual integration endpoints
integration.api.base.url=https://api.yourcompany.com
integration.api.key=your-api-key
integration.timeout.seconds=30

# Process Model Configuration
process.cleanup.days=90
process.archive.days=365

# Performance Settings
cache.expiry.minutes=15
session.timeout.minutes=30
query.timeout.seconds=60

# Logging Configuration
log.level=INFO
log.retention.days=30

# Custom Constants Override
# Override any application constants with environment-specific values
const.ENVIRONMENT=PRODUCTION
const.BASE_URL=https://your-site.appiancloud.com
const.SUPPORT_EMAIL=support@yourcompany.com
const.ADMIN_EMAIL=admin@yourcompany.com

# Data Source Names
# Map template data sources to your environment data sources
datasource.primary=YourPrimaryDataSource
datasource.reporting=YourReportingDataSource

# Connected Systems
# Map template connected systems to your environment systems
connectedsystem.email=YourEmailSystem
connectedsystem.database=YourDatabaseSystem
connectedsystem.api=YourAPISystem

# Record Type Sync Configuration
recordtype.sync.enabled=true
recordtype.sync.frequency=HOURLY

# Notification Settings
notification.email.enabled=true
notification.inapp.enabled=true
notification.sms.enabled=false

# Audit Configuration
audit.enabled=true
audit.retention.days=2555  # 7 years

# Backup Configuration
backup.enabled=true
backup.frequency=DAILY
backup.retention.days=30

# Monitoring Settings
monitoring.enabled=true
monitoring.alert.email=alerts@yourcompany.com

# Custom Properties
# Add any custom properties specific to your environment
custom.property.1=value1
custom.property.2=value2